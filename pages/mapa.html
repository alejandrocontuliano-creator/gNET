<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mapa Interactivo de Guanaqueros | GuanaquerosNet</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .marker-pulse {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#0d191b] dark:text-white overflow-hidden">
<!-- Main Layout Container -->
<div class="relative flex h-screen w-full flex-col">
<!-- Header / Nav Overlay -->
<div id="site-header"></div>
<!-- Sidebar Overlay (Floating) -->
<aside class="absolute left-6 top-24 bottom-6 z-40 w-80 pointer-events-none flex flex-col gap-4">
<!-- Search Container -->
<div class="pointer-events-auto w-full">
<div class="relative flex items-center bg-white/95 dark:bg-background-dark/95 backdrop-blur-md rounded-2xl shadow-xl border border-white/20 overflow-hidden">
<div class="pl-4 text-primary">
<span class="material-symbols-outlined">search</span>
</div>
<input class="w-full bg-transparent border-none focus:ring-0 text-sm py-4 px-3 placeholder:text-gray-400" placeholder="Buscar en Guanaqueros..." type="text"/>
</div>
</div>
<!-- Categories Card -->
<div class="pointer-events-auto flex-1 bg-white/95 dark:bg-background-dark/95 backdrop-blur-md rounded-3xl shadow-xl border border-white/20 overflow-hidden flex flex-col">
<div class="p-6 border-b border-gray-100 dark:border-gray-800">
<div class="flex items-center gap-3">
<div class="bg-primary/10 p-2 rounded-full">
<span class="material-symbols-outlined text-primary">explore</span>
</div>
<div>
<h1 class="text-lg font-bold">Explorar</h1>
<p class="text-xs text-gray-500 dark:text-gray-400 uppercase tracking-widest font-semibold">Guanaqueros, Chile</p>
</div>
</div>
</div>
<div class="p-4 flex flex-col gap-2 overflow-y-auto">
<!-- Category Item Active -->
<button class="flex items-center justify-between w-full px-4 py-3 rounded-2xl bg-primary text-white transition-all shadow-md group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined">restaurant</span>
<span class="text-sm font-semibold">Restaurantes</span>
</div>
<span class="text-xs bg-white/20 px-2 py-0.5 rounded-full">24</span>
</button>
<!-- Category Item -->
<button class="flex items-center justify-between w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/50 hover:bg-primary/10 transition-all group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400 group-hover:text-primary transition-colors">bed</span>
<span class="text-sm font-semibold">Alojamientos</span>
</div>
<span class="text-xs text-gray-400 px-2 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700">12</span>
</button>
<!-- Category Item -->
<button class="flex items-center justify-between w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/50 hover:bg-primary/10 transition-all group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400 group-hover:text-primary transition-colors">camera</span>
<span class="text-sm font-semibold">Atractivos</span>
</div>
<span class="text-xs text-gray-400 px-2 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700">8</span>
</button>
<!-- Category Item -->
<button class="flex items-center justify-between w-full px-4 py-3 rounded-2xl bg-gray-50 dark:bg-gray-800/50 hover:bg-primary/10 transition-all group">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-gray-500 dark:text-gray-400 group-hover:text-primary transition-colors">info</span>
<span class="text-sm font-semibold">Puntos de Interés</span>
</div>
<span class="text-xs text-gray-400 px-2 py-0.5 rounded-full bg-gray-200 dark:bg-gray-700">15</span>
</button>
</div>
<div class="mt-auto p-4 bg-gray-50/50 dark:bg-gray-800/20">
<button class="w-full bg-primary py-3 rounded-xl text-white font-bold text-sm shadow-lg shadow-primary/30 hover:brightness-110 transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-sm">filter_alt</span>
                        Filtrar Mapa
                    </button>
</div>
</div>
</aside>
<!-- Map Container -->
<main class="flex-1 relative bg-[#e5e7eb] overflow-hidden">
<!-- Simulated Map Image Layer -->
<div class="absolute inset-0 z-0 bg-cover bg-center transition-all duration-700" alt="Satellite view of Guanaqueros bay with crystal blue water and white sand" data-location="Guanaqueros, Chile" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDDDLaEI2_QutXtiHzcTTnR1wipXVq0EuCtiZqAreQHr-Q7pbZ1B95uAcd8og7d-R9gEge91RrYYCUABT1VqNZcGgFQAW1IZ0B9Cvur7pP7OkdKt7B-qSOJiUr8cEEUfhPK9Elm6SZHihuSqDRj1DTIRTjBcRWlQImDwHJsD-69rMLK21EDaq2RwPZYYNsmchDVFWV82qpHI-PSu-3zyJp1T88Lkm3ttkSFzUw-cSjc7PMP3ha1aakxoxgEgOMaM3Mi6mUDus7Er48');">
<!-- Map Overlay Gradient for UI Readability -->
<div class="absolute inset-0 bg-gradient-to-t from-black/20 via-transparent to-black/10"></div>
</div>
<!-- Interactive Markers Layer -->
<div class="relative z-10 w-full h-full">
<!-- Marker 1: Restaurante El Pequeño -->
<div class="absolute top-[40%] left-[55%] group cursor-pointer marker-pulse">
<div class="bg-primary p-2 rounded-full text-white shadow-xl hover:scale-125 transition-transform">
<span class="material-symbols-outlined">restaurant</span>
</div>
<!-- Marker Info Popup (Desktop Hover/Click) -->
<div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-4 w-64 opacity-0 group-hover:opacity-100 transition-all pointer-events-none group-hover:pointer-events-auto">
<div class="bg-white dark:bg-background-dark rounded-2xl shadow-2xl overflow-hidden border border-white/20">
<div class="h-24 bg-cover bg-center" alt="Exterior view of a seafood restaurant by the sea" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBlX_tygqe1HpHxPfvci23TFONkhKYR2EAPox-BnG5N94_DE1s4ZfQC6_EmscixduHTY2qJueIDIjPDeuGA78lW-ZQlCtNEi35LyL2VWJiX2zbUtIwnATUEt_M8JkMoE962zXSaAbHwZXUMoHaYRmLNbf5MEdkqFWgVCWpka7beFgGrdrtdF6D65EhPRINnNIuAT-JHkl8paXK5LycouHzasfvQf-Y9uYQGpZXqF8x6GXjzrU8Fie10S0FJbqqKoUM9x_RfjBI061k');"></div>
<div class="p-4">
<div class="flex justify-between items-start mb-1">
<h3 class="font-bold text-sm">Restaurante El Pequeño</h3>
<span class="text-xs bg-green-100 text-green-600 px-2 py-0.5 rounded-full font-bold">Abierto</span>
</div>
<div class="flex items-center gap-1 mb-3">
<span class="material-symbols-outlined text-yellow-400 text-xs">star</span>
<span class="text-xs font-bold">4.8</span>
<span class="text-xs text-gray-500">(120 reviews)</span>
</div>
<button class="w-full bg-primary/10 text-primary py-2 rounded-xl text-xs font-bold hover:bg-primary hover:text-white transition-colors flex items-center justify-center gap-1">
                                    Ver más <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</div>
<div class="w-4 h-4 bg-white dark:bg-background-dark rotate-45 mx-auto -mt-2 shadow-lg"></div>
</div>
</div>
<!-- Marker 2: Cabañas de la Bahía -->
<div class="absolute top-[30%] left-[48%] group cursor-pointer">
<div class="bg-white dark:bg-background-dark p-2 rounded-full text-primary shadow-xl hover:scale-125 transition-transform border-2 border-primary">
<span class="material-symbols-outlined">bed</span>
</div>
</div>
<!-- Marker 3: Mirador del Faro -->
<div class="absolute top-[60%] left-[35%] group cursor-pointer">
<div class="bg-[#ff9f43] p-2 rounded-full text-white shadow-xl hover:scale-125 transition-transform">
<span class="material-symbols-outlined">camera</span>
</div>
</div>
<!-- Marker 4: Muelle Pesquero -->
<div class="absolute top-[45%] left-[58%] group cursor-pointer">
<div class="bg-white dark:bg-background-dark p-2 rounded-full text-blue-500 shadow-xl hover:scale-125 transition-transform border-2 border-blue-500">
<span class="material-symbols-outlined">info</span>
</div>
</div>
</div>
<!-- Bottom Control Cluster -->
<div class="absolute bottom-10 right-10 z-40 flex flex-col gap-4">
<div class="flex flex-col bg-white/90 dark:bg-background-dark/90 backdrop-blur-md rounded-2xl shadow-xl overflow-hidden border border-white/20">
<button class="p-3 hover:bg-primary/10 transition-colors border-b border-gray-100 dark:border-gray-800">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300">add</span>
</button>
<button class="p-3 hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-gray-600 dark:text-gray-300">remove</span>
</button>
</div>
<button class="bg-primary p-4 rounded-full text-white shadow-xl shadow-primary/30 hover:scale-110 active:scale-95 transition-all">
<span class="material-symbols-outlined">my_location</span>
</button>
<button class="bg-white/90 dark:bg-background-dark/90 backdrop-blur-md p-4 rounded-full text-gray-600 dark:text-gray-300 shadow-xl border border-white/20 hover:scale-110 transition-all">
<span class="material-symbols-outlined">layers</span>
</button>
</div>
</main>
<!-- Horizontal Quick Filter (Mobile/Tablet helper) -->
<div class="absolute bottom-8 left-[360px] right-[100px] z-40 md:flex hidden">
<div class="flex gap-2 p-2 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md rounded-full border border-white/20 shadow-lg max-w-full overflow-x-auto no-scrollbar">
<div class="flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-primary px-4 py-2 text-white">
<span class="material-symbols-outlined text-sm">restaurant</span>
<p class="text-xs font-bold">Restaurantes</p>
</div>
<div class="flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-gray-800 px-4 py-2 hover:bg-primary/10 cursor-pointer transition-colors">
<span class="material-symbols-outlined text-sm text-gray-500">bed</span>
<p class="text-xs font-bold">Alojamientos</p>
</div>
<div class="flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-gray-800 px-4 py-2 hover:bg-primary/10 cursor-pointer transition-colors">
<span class="material-symbols-outlined text-sm text-gray-500">beach_access</span>
<p class="text-xs font-bold">Playas</p>
</div>
<div class="flex shrink-0 items-center justify-center gap-x-2 rounded-full bg-white dark:bg-gray-800 px-4 py-2 hover:bg-primary/10 cursor-pointer transition-colors">
<span class="material-symbols-outlined text-sm text-gray-500">directions_boat</span>
<p class="text-xs font-bold">Tours</p>
</div>
</div>
</div>
</div>
<div id=\"site-footer\"></div>

  <script type="module" src="../js/include.js"></script>
</body></html>
