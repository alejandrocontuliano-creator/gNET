<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GuanaquerosNet - Directorio de Servicios</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13c8ec",
                        "background-light": "#f6f8f8",
                        "background-dark": "#101f22",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-filter-fill {
            font-variation-settings: 'FILL' 1;
        }
        body {
            font-family: "Plus Jakarta Sans", sans-serif;
        }
        /* Custom Checkbox Tick */
        .custom-checkbox {
            --checkbox-tick-svg: url('data:image/svg+xml,%3csvg viewBox=%270 0 16 16%27 fill=%27rgb(13,25,27)%27 xmlns=%27http://www.w3.org/2000/svg%27%3e%3cpath d=%27M12.207 4.793a1 1 0 010 1.414l-5 5a1 1 0 01-1.414 0l-2-2a1 1 0 011.414-1.414L6.5 9.086l4.293-4.293a1 1 0 011.414 0z%27/%3e%3c/svg%3e');
        }
    </style>
  <link rel="stylesheet" href="shared/base.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="bg-background-light dark:bg-background-dark text-[#0d191b] dark:text-white transition-colors duration-200">
<!-- Top Navigation Bar -->
<div id="site-header"></div>
<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
<section class="max-w-6xl mx-auto px-4 py-10">
  <h1 class="text-3xl font-bold">Directorio</h1>
  <p class="text-slate-600 mt-2">Alojamientos, gastronomía y servicios locales.</p>

  <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-3">
    <input id="search" type="search" placeholder="Buscar (nombre, sector, tag…)" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-300">
    <select id="filter-type" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-300">
      <option value="">Todos los tipos</option>
      <option value="alojamiento">Alojamiento</option>
      <option value="gastronomia">Gastronomía</option>
      <option value="servicio">Servicio</option>
    </select>
    <select id="filter-sector" class="w-full px-4 py-3 rounded-2xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-slate-300">
      <option value="">Todos los sectores</option>
    </select>
  </div>

  <div id="places-list" class="mt-6"></div>
</section>
</main>
<!-- Mobile Filter FAB -->
<button class="lg:hidden fixed bottom-6 right-6 z-40 bg-primary text-background-dark w-14 h-14 rounded-full shadow-2xl flex items-center justify-center active:scale-95 transition-transform">
<span class="material-symbols-outlined">tune</span>
</button>
<div id=\"site-footer\"></div>

  <script src="../js/include.js"></script>
  <script src="../js/directorio.js"></script>
</body></html>
